name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run of the same branch.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      # One version failing should not hide the result of the others.
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pycfd/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pycfd/requirements.txt

      - name: Report the environment
        # Numerical results depend on these; printing them makes a
        # platform-specific baseline failure diagnosable from the log alone.
        run: |
          python -c "import numpy, scipy, matplotlib; \
            print('numpy', numpy.__version__); \
            print('scipy', scipy.__version__); \
            print('matplotlib', matplotlib.__version__)"
          python -c "import numba; print('numba', numba.__version__)" || echo "numba: not installed"

      - name: Run the test suite
        # Matplotlib must not try to open a display on a headless runner.
        env:
          MPLBACKEND: Agg
        run: python -m pytest pycfd/tests -q

  benchmarks:
    name: full-fidelity benchmarks
    runs-on: ubuntu-latest
    # Several minutes of solver time, so this runs on main and on demand rather
    # than on every pull request.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pycfd/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pycfd/requirements.txt

      - name: Run benchmark regressions at published resolutions
        env:
          MPLBACKEND: Agg
        run: python -m pytest pycfd/tests/test_regression.py --runslow -q
