name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: >-
          Also rerun the benchmarks at their published resolutions.
          Minutes of solver time -- opt in when numerics changed.
        type: boolean
        default: false

concurrency:
  # A new push supersedes an in-flight run of the same branch. The event name is
  # part of the key so that a push cannot cancel a benchmark run someone asked
  # for by hand -- those are long, deliberate, and worth protecting.
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  suite:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    # Roughly 90 s in practice; this only exists so a hang fails loudly instead
    # of sitting on a runner for GitHub's six-hour default.
    timeout-minutes: 15
    strategy:
      # One version failing should not hide the result of the others.
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Report the environment
        # Numerical results depend on these; printing them makes a
        # platform-specific baseline failure diagnosable from the log alone.
        run: |
          python -c "import numpy, scipy, matplotlib; \
            print('numpy', numpy.__version__); \
            print('scipy', scipy.__version__); \
            print('matplotlib', matplotlib.__version__)"
          python -c "import numba; print('numba', numba.__version__)" || echo "numba: not installed"

      - name: Run the test suite
        # Matplotlib must not try to open a display on a headless runner.
        env:
          MPLBACKEND: Agg
        run: python -m pytest pycfd/tests -q

  benchmarks:
    name: full-fidelity benchmarks
    runs-on: ubuntu-latest
    # Opt-in only. This reruns the cases at the resolutions docs/validation.md
    # quotes, which is minutes of solver time on a warm 8-core laptop and
    # considerably more on a shared two-core runner. It ran for 64 minutes
    # without finishing on its first automatic attempt, so it no longer fires on
    # push: request it from the Actions tab when the numerics change or before
    # tagging a release. The fast tier on every push already covers the same
    # cases at reduced resolution.
    if: github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run benchmark regressions at published resolutions
        env:
          MPLBACKEND: Agg
        # --durations reports every case's wall time. The first completed run
        # tells us what this actually costs on a runner, which is the number
        # needed to tighten the timeout above from a guess to a measurement.
        run: python -m pytest pycfd/tests/test_regression.py --runslow -q --durations=0
